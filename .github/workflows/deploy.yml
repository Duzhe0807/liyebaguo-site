name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liyanbaguo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.TICKETING_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=out -czf /tmp/liyebaguo-source.tar.gz .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%b\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%b\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: scp -i ~/.ssh/deploy_key /tmp/liyebaguo-source.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/liyebaguo-source.tar.gz"

      - name: Build, migrate and switch release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n bash -s" <<'REMOTE'
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          release="/opt/liyebaguo/releases/$stamp"
          test -f /etc/liyebaguo/app.env
          command -v node >/dev/null
          command -v pnpm >/dev/null
          install -d -m 755 "$release"
          tar -xzf /tmp/liyebaguo-source.tar.gz -C "$release"
          rm -f /tmp/liyebaguo-source.tar.gz
          ln -s /etc/liyebaguo/app.env "$release/.env"
          cd "$release"
          pnpm install --frozen-lockfile
          pnpm db:migrate
          pnpm build
          ln -sfn "$release" /opt/liyebaguo/current.new
          mv -Tf /opt/liyebaguo/current.new /opt/liyebaguo/current
          systemctl restart liyebaguo-web.service
          systemctl is-active --quiet liyebaguo-web.service
          find /opt/liyebaguo/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://gongyanshow.com/api/health > /dev/null
          curl --fail --silent --show-error https://gongyanshow.com/zh/ > /dev/null